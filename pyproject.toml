[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sibernetick-defense-core"
version = "0.1.0"
description = "Experimental defensive workflow components extracted from Project Keymaker"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["starlette>=1.7,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
